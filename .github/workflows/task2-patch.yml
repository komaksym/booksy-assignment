name: One-time Task 2 patch

on:
  push:
    branches: [codex/03-rental]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run-task2-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/03-rental
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked
      - name: Apply role-safe status filter patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}: {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          app = Path("src/hardware_hub/app.py")
          replace_once(
              app,
              "_ORIGINAL_SOURCE_COUNT = 11\n",
              "_ORIGINAL_SOURCE_COUNT = 11\n"
              "_ORDINARY_STATUS_CHOICES = (\"Available\", \"In Use\", \"Repair\")\n"
              "_ADMIN_STATUS_CHOICES = (*_ORDINARY_STATUS_CHOICES, \"Needs correction\")\n\n\n"
              "def _status_choices(user: dict[str, Any]) -> tuple[str, ...]:\n"
              "    \"\"\"Return the dashboard status filters available to the current role.\"\"\"\n\n"
              "    return _ADMIN_STATUS_CHOICES if user[\"role\"] == \"admin\" else _ORDINARY_STATUS_CHOICES\n",
          )
          replace_once(
              app,
              '        "brands": brands,\n        "error": error,\n',
              '        "brands": brands,\n'
              '        "status_choices": _status_choices(user),\n'
              '        "error": error,\n',
          )
          replace_once(
              app,
              "        try:\n            records = filter_and_sort(visible, **filters)\n",
              "        try:\n"
              "            if status_filter and status_filter not in _status_choices(user):\n"
              "                raise InventoryInputError(\"Choose a supported status filter\")\n"
              "            records = filter_and_sort(visible, **filters)\n",
          )

          dashboard = Path("src/hardware_hub/templates/dashboard.html")
          replace_once(
              dashboard,
              '        {% set statuses = ["Available", "In Use", "Repair", "Needs correction"] %}\n'
              '        {% if filters.status and filters.status not in statuses %}\n',
              '        {% if filters.status and filters.status not in status_choices %}\n',
          )
          replace_once(
              dashboard,
              "        {% for status in statuses %}\n",
              "        {% for status in status_choices %}\n",
          )

          Path(".github/workflows/task2-patch.yml").unlink()
          PY
      - run: uv run ruff format src/hardware_hub/app.py tests/test_dashboard_filters.py
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: git diff --check
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hardware_hub/app.py src/hardware_hub/templates/dashboard.html tests/test_dashboard_filters.py .github/workflows/task2-patch.yml
          git commit -m "fix(dashboard): scope status filters by role" -m "Supply filter choices from Python, conceal the administrator-only correction option from ordinary users, and reject crafted ordinary requests before inventory filtering."
          git push origin HEAD:codex/03-rental
