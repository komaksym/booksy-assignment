name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  apply-task2-docs:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/03-rental'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/03-rental
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked
      - name: Align Slice 3 docs with focused acceptance coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}: {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          spec = Path("docs/superpowers/specs/2026-07-22-slice-3-safe-rental-design.md")
          replace_once(
              spec,
              "- one end-to-end two-user rental test; and",
              "- focused rental tests with small shared helpers; and",
          )
          replace_once(spec, "## Automated Acceptance Journey", "## Automated Acceptance Coverage")
          replace_once(
              spec,
              "Add one integration test named:\n\n"
              "```text\n"
              "test_rent_and_return_enforce_safety_ownership_and_history\n"
              "```\n\n"
              "Use the existing application/TestClient fixture and two administrator-created\n"
              "ordinary users. The test performs one coherent browser journey:",
              "Use the existing application/TestClient fixture and focused tests with small shared\n"
              "helpers. Together they cover these browser-visible journeys:",
          )
          replace_once(
              spec,
              "Also retain the full existing auth, seed, finding, and inventory suite. Do not split\n"
              "the journey into broad low-value helper tests unless a discovered defect requires a\n"
              "small regression test.",
              "Also retain the full existing auth, seed, finding, and inventory suite. Keep shared\n"
              "helpers small and behavior-focused, and preserve the complete storage, authorization,\n"
              "privacy, rendering, and no-write assertion set while splitting the journeys.",
          )
          replace_once(
              spec,
              "### Task 3.1 — Write the failing rental journey",
              "### Task 3.1 — Write failing focused rental tests",
          )
          replace_once(
              spec,
              "- [ ] Create `tests/test_rental.py` with the complete journey above.\n"
              "- [ ] Run only that test and capture the expected failure before production code.",
              "- [ ] Create focused tests in `tests/test_rental.py` covering the complete behavior above.\n"
              "- [ ] Run the focused test file and capture the expected failure before production code.",
          )
          replace_once(
              spec,
              "- The focused rental journey and complete existing suite pass.",
              "- The focused rental tests and complete existing suite pass.",
          )

          plan = Path("docs/superpowers/plans/2026-07-22-slice-3-safe-rental-implementation.md")
          replace_once(
              plan,
              "- [ ] **Step 1: Write the failing HTTP/storage journey**",
              "- [ ] **Step 1: Write failing focused HTTP/storage tests**",
          )
          replace_once(
              plan,
              "Create\n"
              "`test_rent_and_return_enforce_safety_ownership_and_history` in\n"
              "`tests/test_rental.py`. Use `create_user`, two ordinary users, the existing client,\n"
              "`Query`, and deep document snapshots. The test must execute these states in order:",
              "Create focused tests in `tests/test_rental.py`. Use `create_user`, two ordinary users,\n"
              "the existing client, `Query`, and deep document snapshots. Split role, rent, return,\n"
              "privacy, and no-write behavior into coherent journeys that collectively execute:",
          )
          plan_text = plan.read_text(encoding="utf-8")
          node = "uv run pytest -q tests/test_rental.py::test_rent_and_return_enforce_safety_ownership_and_history"
          if plan_text.count(node) != 2:
              raise SystemExit(f"expected two focused-node commands: {plan_text.count(node)}")
          plan.write_text(plan_text.replace(node, "uv run pytest -q tests/test_rental.py"), encoding="utf-8")
          replace_once(
              plan,
              "- [ ] **Step 1: Extend the journey with failing presentation/privacy assertions**",
              "- [ ] **Step 1: Add failing presentation/privacy assertions to focused tests**",
          )
          replace_once(
              plan,
              "Add assertions at the existing journey's natural points:",
              "Add assertions at the focused tests' natural points:",
          )
          replace_once(
              plan,
              "Run the same focused pytest node. Expected: FAIL on absent contextual actions,",
              "Run `uv run pytest -q tests/test_rental.py`. Expected: FAIL on absent contextual actions,",
          )
          replace_once(
              plan,
              "Expected: focused rental journey passes; the complete suite passes.",
              "Expected: focused rental tests pass; the complete suite passes.",
          )
          replace_once(
              plan,
              "Expected: focused journey and full suite pass, with no new warning.",
              "Expected: focused tests and full suite pass, with no new warning.",
          )
          replace_once(
              plan,
              "single-worker TinyDB limitation; no admin forced return or due dates",
              "single-worker TinyDB limitation; admin release only through edit; no reassignment or due dates",
          )

          log = Path("docs/ai-development-log.md")
          replace_once(
              log,
              "Administrators retain traceability\n"
              "through resolved application-user emails but cannot rent, return, or force a return.\n",
              "Administrators retain traceability through resolved application-user emails and can\n"
              "release a held item only through the bounded edit override; they cannot use rent/return\n"
              "routes.\n",
          )
          replace_once(
              log,
              "The work followed one test-first browser/storage journey, then bounded implementation\n"
              "tasks and independent review. The journey covers a critical rejection, warning-only\n"
              "rental, repeated-action no-write behavior, owner-only return, administrator denial,\n"
              "append-only UTC history, and privacy-aware rendering. Review first added safe\n"
              "detail-page POST controls; later review corrections prevented canonical-null values\n"
              "from leaking through ordinary-user dashboard options and projected dashboard rows so\n"
              "raw holder IDs, event data, timestamps, and other stored evidence never reach\n"
              "ordinary-user templates.\n",
              "The work began with a test-first browser/storage journey, then review split the\n"
              "oversized scenario into focused role, rent, return, privacy, and safety-handoff tests\n"
              "with small shared helpers. Together they preserve the critical rejection, warning-only\n"
              "rental, repeated-action no-write behavior, owner-only return, administrator denial,\n"
              "append-only UTC history, and privacy-aware rendering assertions. Review corrections\n"
              "also scope status-filter choices by role, reject crafted ordinary-user correction\n"
              "filters, and prove that safety evidence added during a rental never blocks the owner\n"
              "return but immediately blocks the next rent.\n",
          )

          plans = Path("PLANS.md")
          replace_once(
              plans,
              "| 3 | `codex/03-rental` | Guarded rent/return flow with ownership and visible history | PR review fixes in progress |",
              "| 3 | `codex/03-rental` | Guarded rent/return flow with ownership and visible history | Review fixes implemented; final validation |",
          )

          checkpoint = Path("checkpoint.md")
          replace_once(
              checkpoint,
              "## Next task — not started\n",
              "## Task 2 — implemented; final review pending\n\n"
              "The focused rental-test refactor, safety-handoff regression, and role-scoped status\n"
              "filters are implemented. The original requirements below remain as the preserved\n"
              "handoff contract.\n\n",
          )

          Path(".github/workflows/ci.yml").write_text(
              """name: CI

          on:
            pull_request:
            push:
              branches: [main]

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
                - run: uv sync --locked
                - run: uv run ruff format --check .
                - run: uv run ruff check .
                - run: uv run pytest -q
          """.replace("          ", ""),
              encoding="utf-8",
          )
          PY
      - run: uv lock --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - run: git diff --check
      - name: Commit verified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(rental): align focused review coverage" -m "Replace the obsolete monolithic-test contract with focused acceptance journeys, record the safety-handoff and role-filter corrections, advance the roadmap status, and refresh the checkpoint after the full validation gate."
          git push origin HEAD:codex/03-rental
