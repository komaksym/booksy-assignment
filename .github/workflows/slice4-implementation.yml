name: Slice 4 implementation

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/04-audit-release]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/04-audit-release
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Write audit behavior tests first
        run: python .github/scripts/implement_slice4.py tests-only
      - name: Correct generated access matrix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_audit.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("    for method in (client.get, client.post):")
          end = text.index("\n\n    calls = 0", start)
          replacement = '''    for method, route in (
              (client.get, "/admin/audit"),
              (client.post, "/admin/audit/llm"),
          ):
              response = method(route, follow_redirects=False)
              assert response.status_code == 303
              assert response.headers["location"] == "/login"'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Confirm RED before production implementation
        shell: bash
        run: |
          uv sync --locked
          set +e
          uv run pytest tests/test_audit.py -q > /tmp/slice4-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/slice4-red.log
          if [ "$red_status" -eq 0 ]; then
            echo "Expected the new Slice 4 tests to fail before implementation."
            exit 1
          fi
      - name: Apply approved Slice 4 implementation
        run: python .github/scripts/implement_slice4.py implementation
      - name: Regenerate dependencies
        run: |
          uv lock
          uv lock --check
          uv sync --locked
      - name: Attempt formatting and persist exact result
        shell: bash
        run: |
          set +e
          uv run ruff format . > /tmp/slice4-format.log 2>&1
          format_status=$?
          set -e
          cat /tmp/slice4-format.log
          rm .github/workflows/slice4-implementation.yml
          rm .github/scripts/implement_slice4.py
          rm .github/slice4-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "wip(audit): persist generated implementation" -m "Persists the exact test-first Slice 4 output after the RED audit test and dependency regeneration. The formatting gate still reports a parse defect; this commit is intentionally unverified and exists only so the generated source can be inspected and repaired."
          git push origin HEAD:codex/04-audit-release
          exit "$format_status"
