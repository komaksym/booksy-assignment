name: Slice 4 review fixes

on:
  push:
    branches: [codex/04-audit-release]

permissions:
  contents: write

jobs:
  review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/04-audit-release
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Apply focused review corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/hardware_hub/audit.py",
              "    except (KeyError, IndexError, TypeError, ValueError, ValidationError):\n",
              "    except (AttributeError, KeyError, IndexError, TypeError, ValueError, ValidationError):\n",
          )
          replace_once(
              "pyproject.toml",
              'dev = [\n    "httpx>=0.28,<1",\n',
              "dev = [\n",
          )
          replace_once(
              "src/hardware_hub/config.py",
              '"""Application settings for the first delivery slice."""\n',
              '"""Application runtime settings."""\n',
          )
          replace_once(
              "README.md",
              "leave inventory byte-for-byte equivalent at the document\nlevel.",
              "leave every stored inventory document unchanged.",
          )

          test_path = Path("tests/test_audit.py")
          tests = test_path.read_text(encoding="utf-8")
          addition = r'''


@pytest.mark.parametrize("failure_mode", ["unexpected-envelope", "non-stop"])
def test_unexpected_or_incomplete_provider_envelope_falls_back(
    failure_mode: str,
    client: TestClient,
    app: FastAPI,
    settings: Settings,
) -> None:
    _login_admin(client, settings)
    _configure_llm(app)
    before = copy.deepcopy(app.state.hardware.all())
    explanation = "This incomplete suggestion must never render."
    valid_content = json.dumps(
        {
            "findings": [
                {
                    "hardware_id": before[0]["id"],
                    "severity": "warning",
                    "explanation": explanation,
                    "recommendation": "Do not render this row.",
                }
            ]
        }
    )

    def provider(_request: httpx.Request) -> httpx.Response:
        if failure_mode == "unexpected-envelope":
            return httpx.Response(200, json={"choices": [None]})
        return _provider_response(valid_content, finish_reason="length")

    app.state.llm_transport = httpx.MockTransport(provider)
    response = client.post("/admin/audit/llm")

    assert response.status_code == 200
    assert "DeepSeek audit was unavailable or invalid." in response.text
    assert "Deterministic findings remain complete." in response.text
    assert "AI suggestions — not operational decisions" not in response.text
    assert explanation not in response.text
    assert app.state.hardware.all() == before
'''
          if "test_unexpected_or_incomplete_provider_envelope_falls_back" in tests:
              raise SystemExit("Review regression already exists")
          test_path.write_text(tests.rstrip() + addition + "\n", encoding="utf-8")
          PY
      - name: Regenerate dependencies and format
        run: |
          uv lock
          uv sync --locked
          uv run ruff format .
      - name: Verify review corrections
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest -q
          uv build
          git diff --check
      - name: Commit verified review corrections
        run: |
          rm .github/workflows/slice4-review-fixes.yml
          rm .github/slice4-review-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audit): harden provider fallback" -m "Treats malformed object-shaped provider envelopes and non-stop completions as atomic audit failures, adds regressions proving deterministic results and inventory remain intact, removes the duplicate HTTPX development declaration, and tightens documentation wording. The full lock, format, lint, pytest, build, and diff gate passed before commit."
          git push origin HEAD:codex/04-audit-release
