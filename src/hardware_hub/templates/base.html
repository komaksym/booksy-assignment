<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hardware Hub{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body>
    {% if user %}
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="Hardware Hub home">
          <span class="wordmark-mark" aria-hidden="true">H</span>
          <span>Hardware Hub</span>
        </a>
        <div class="session-controls">
          <div class="identity">
            <strong>{{ user.email }}</strong>
            <span>{{ user.role }}</span>
          </div>
          {% if user.role == "admin" %}
            <a class="button button-secondary" href="/admin/users">Users</a>
          {% endif %}
          <form method="post" action="/logout">
            <button class="button button-quiet" type="submit">Log out</button>
          </form>
        </div>
      </header>
    {% endif %}
    <main class="page-shell {% block shell_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
