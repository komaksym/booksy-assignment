<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hardware Hub{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body{% if user %} class="authenticated"{% endif %}>
    {% if user %}
      <div class="app-layout">
        <aside class="site-sidebar">
          <a class="wordmark" href="/" aria-label="Hardware Hub home">
            <span class="wordmark-mark" aria-hidden="true">H</span>
            <span>Hardware Hub</span>
          </a>
          <nav class="site-nav" aria-label="Main navigation">
            <a href="/">Inventory</a>
            {% if user.role == "admin" %}
              <a href="/admin/users">Users</a>
              <a href="/admin/audit">Audit</a>
            {% endif %}
          </nav>
          <div class="session-controls">
            <div class="identity">
              <strong>{{ user.email }}</strong>
              <span>{{ user.role }}</span>
            </div>
            <form method="post" action="/logout">
              <button class="button button-quiet" type="submit">Log out</button>
            </form>
          </div>
        </aside>
    {% endif %}
    <main class="page-shell {% block shell_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    {% if user %}
      </div>
    {% endif %}
  </body>
</html>
